name: CI

on:
  push:
  pull_request:
  schedule:
    # Daily: the published API may have changed since the snapshot was taken.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the OpenAPI snapshot
        run: |
          pnpm generate
          git diff --exit-code -- src/generated
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Smoke test the built package (require and import)
        run: pnpm test:smoke
      - name: Check the published types for ESM and CommonJS
        run: pnpm check:exports
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  snapshot:
    name: OpenAPI snapshot matches the published API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/sync-openapi.mjs --check

  runtimes:
    name: Runtime smoke (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # No pnpm in this job: setup-node would otherwise cache for the
          # packageManager field and fail looking for pnpm.
          package-manager-cache: false
      - run: node test/smoke/smoke.cjs
      - run: node test/smoke/smoke.mjs
